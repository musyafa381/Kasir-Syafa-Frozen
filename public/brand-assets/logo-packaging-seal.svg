<svg viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="dropTop" x1="60" y1="30" x2="160" y2="120" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#0284C7" />
        </linearGradient>
        <linearGradient id="dropBottom" x1="40" y1="80" x2="140" y2="170" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0284C7" />
            <stop offset="100%" stop-color="#163144" />
        </linearGradient>
        <!-- Arched Path for Top Text -->
        <path id="textCircleTop" d="M 160 400 A 240 240 0 0 1 640 400" />
        <!-- Arched Path for Bottom Text -->
        <path id="textCircleBottom" d="M 640 400 A 240 240 0 0 1 160 400" />
    </defs>
    
    <!-- Outer Decorative Rings -->
    <circle cx="400" cy="400" r="375" fill="#FFFFFF" stroke="#0284C7" stroke-width="6" />
    <circle cx="400" cy="400" r="355" fill="none" stroke="#163144" stroke-width="2" stroke-dasharray="8 6" />
    <circle cx="400" cy="400" r="290" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4" />
    
    <!-- Curved Circular Typography -->
    <text font-family="'Urbanist', system-ui, sans-serif" font-weight="900" font-size="34" fill="#163144" letter-spacing="8">
        <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
            ★ SYAFA FROZEN FOOD ★
        </textPath>
    </text>
    <text font-family="'Urbanist', system-ui, sans-serif" font-weight="800" font-size="28" fill="#0284C7" letter-spacing="10">
        <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
            • HIGIENIS &amp; BERKUALITAS •
        </textPath>
    </text>

    <!-- Center Badge & Twin Ice Drops -->
    <circle cx="400" cy="400" r="200" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="4" />
    <g transform="translate(230, 230) scale(1.7)">
        <path d="M140 40 C100 25 55 55 60 95 C62 110 75 115 90 115 C115 115 135 105 138 85 C142 65 140 40 140 40 Z" fill="url(#dropTop)" />
        <path d="M60 160 C100 175 145 145 140 105 C138 90 125 85 110 85 C85 85 65 95 62 115 C58 135 60 160 60 160 Z" fill="url(#dropBottom)" />
    </g>
</svg>
